services:
  mysql:
    image: mysql:8.4
    container_name: social-mysql
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-local-development-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-social}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: social-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    container_name: social-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  canal:
    image: canal/canal-server:v1.1.8
    container_name: social-canal
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      canal.auto.scan: "false"
      canal.destinations: social-post
      canal.serverMode: kafka
      canal.mq.servers: kafka:19092
      canal.mq.flatMessage: "true"
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: root
      canal.instance.dbPassword: ${MYSQL_PASSWORD:-local-development-password}
      canal.instance.connectionCharset: UTF-8
      canal.instance.gtidon: "false"
      canal.instance.tsdb.enable: "false"
      canal.instance.filter.regex: social\\.post
      canal.mq.topic: social.post.cdc
      canal.mq.partition: "0"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: social-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: social-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-development-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-social}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-social_posts}
      UPLOAD_ROOT: /app/uploads
      PUBLIC_UPLOAD_BASE_URL: /uploads
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: social-worker
    command: ["./social-worker"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      canal:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-development-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-social}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:19092}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-social_posts}
      UPLOAD_ROOT: /app/uploads
      PUBLIC_UPLOAD_BASE_URL: /uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    container_name: social-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  elasticsearch_data:
  api_uploads:
